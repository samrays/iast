name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      gateway: ${{ steps.filter.outputs.gateway }}
      worker: ${{ steps.filter.outputs.worker }}
      agent: ${{ steps.filter.outputs.agent }}
      docs: ${{ steps.filter.outputs.docs }}
      changelog: ${{ steps.filter.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            gateway:
              - 'apps/gateway/**'
              - 'packages/proto/**'
              - '.github/workflows/ci.yml'
            worker:
              - 'apps/worker/**'
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            agent:
              - 'agents/runtime/java-agent/**'
              - 'packages/proto/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '*.md'
            changelog:
              - 'apps/**'
              - 'agents/**'

  quality:
    name: Lint, format and types
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e "apps/api[dev]"
      - name: Ruff
        run: ruff check apps/api
      - name: Black
        run: black --check apps/api
      - name: mypy
        working-directory: apps/api
        run: mypy src
      - name: Layer boundaries (ADR-0002)
        run: python scripts/check_layering.py

  test:
    name: Tests and coverage
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e "apps/api[dev]"
      - name: Run suite
        working-directory: apps/api
        env:
          # The suite creates a NOSUPERUSER role of its own from this admin connection:
          # superusers bypass row-level security, so the isolation tests would be
          # meaningless if the application connected as one.
          AEGIS_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aegis_test
        run: pytest --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: apps/api/coverage.xml

  migrations:
    name: Migrations apply and revert cleanly
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e "apps/api[dev]"
      - name: Upgrade, downgrade, upgrade
        working-directory: apps/api
        env:
          AEGIS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aegis
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Assert the migration matches the ORM metadata
        working-directory: apps/api
        env:
          AEGIS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aegis
        run: |
          # An empty autogenerate diff proves the checked-in migration and the models agree.
          alembic check

  dashboard:
    name: Console types, lint and unit tests
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  dashboard-e2e:
    name: Console end-to-end against a live API
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AEGIS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aegis
      AEGIS_CORS_ORIGINS: http://localhost:3100
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: |
          pip install -e "apps/api[dev]"
          npm ci
      - name: Migrate and start the API
        working-directory: apps/api
        run: |
          alembic upgrade head
          nohup python -m uvicorn aegis_api.main:app --port 8080 --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break || sleep 1; done
      - name: Build and start the console
        run: |
          npm run build
          nohup npm run start --workspace @aegis/dashboard &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/login && break || sleep 1; done
      - name: Playwright
        working-directory: apps/dashboard
        run: |
          npx playwright install --with-deps chromium
          E2E_NO_SERVER=1 npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report

  gateway:
    name: Gateway lint, types and tests
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e "apps/gateway[dev]"
      - name: Ruff
        run: ruff check apps/gateway
      - name: Black
        run: black --check apps/gateway
      - name: mypy
        working-directory: apps/gateway
        run: mypy src
      - name: Layer boundaries (ADR-0002)
        run: python scripts/check_layering.py
      - name: Tests
        working-directory: apps/gateway
        run: pytest

  worker:
    name: Worker lint, types and tests
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e "apps/api" -e "apps/worker[dev,kafka]"
      - name: Ruff
        run: ruff check apps/worker
      - name: Black
        run: black --check apps/worker
      - name: mypy
        working-directory: apps/worker
        run: mypy src
      - name: Layer boundaries (ADR-0002)
        run: python scripts/check_layering.py
      - name: Tests
        working-directory: apps/worker
        run: pytest

  agent:
    name: Java agent unit and integration tests
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        working-directory: agents/runtime/java-agent
        # `verify`, not `test`: the JDK-core instrumentation can only be exercised against the
        # packaged jar, because bootstrap injection needs a real jar file. This is also where
        # both Phase 4 gates run — CorpusIT (100% recall, zero false positives) and OverheadIT
        # (instrumentation cost against a budget). Raise aegis.overhead.max.percent if a runner
        # is too contended to measure; do not delete the gate.
        run: mvn -B verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegis-agent-jar
          path: agents/runtime/java-agent/target/aegis-agent.jar

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip install -e "apps/api" -e "apps/gateway[kafka]" -e "apps/worker[kafka]"
          pip-audit --skip-editable
      - name: JavaScript dependency audit
        run: |
          npm ci
          node --test scripts/check_npm_audit.test.mjs
          node scripts/check_npm_audit.mjs

  changelog:
    name: CHANGELOG updated
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.changelog == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG entry
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG updated."
          else
            echo "::error::Changes under apps/ or agents/ require a CHANGELOG.md entry (see CONTRIBUTING.md)."
            exit 1
          fi
