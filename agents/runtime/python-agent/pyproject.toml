[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-python-agent"
version = "0.1.0"
description = "Aegis IAST Python runtime agent — sys.monitoring taint tracking, RASP protection & telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis_python_agent = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aegis_python_agent"]
